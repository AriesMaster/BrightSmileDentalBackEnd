name: .NET CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore BrightSmileDEntal.slnx
      - run: dotnet build BrightSmileDEntal.slnx --configuration Release --no-restore
      - run: dotnet publish BrightSmileDEntal/BrightSmileDEntal.csproj --configuration Release --no-build --output publish
      - uses: actions/upload-artifact@v7
        with:
          name: dotnet-build
          path: publish/
          retention-days: 7
